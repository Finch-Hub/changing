name: changing
description: 变化记录 App —— 跨时间照片变化记录工具（对齐拍照 + 时间轴对比 + 缩时影片）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 系统控件中文本地化（日期选择器等 Material 文案）
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  provider: ^6.1.1

  # 本地数据库（记录项目 / 记录点）
  sqflite: ^2.3.3
  path: ^1.9.0

  # 本地优先存储 / 偏好
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # 图片处理（封面缩略、对比图导出、虚影叠加）
  image: ^4.1.7

  # 读取照片 EXIF（GPS 地理位置信息）
  exif: ^3.3.0

  # 相机（对齐拍照：实时取景 + 半透明参考图虚影叠加）
  camera: ^0.12.2

  # 相册读写（保存/导出对比图、缩时影片）
  image_picker: ^1.1.2
  gal: ^2.3.0

  # 系统分享（对比图 / 缩时影片）
  # 注：10.x 的 android/build.gradle 在 Gradle 9 + 跨盘符(C:缓存/D:工程)下
  # 触发 kotlin-android "different roots" 崩溃，升级到新版 AGP 兼容构建
  share_plus: ^13.3.1

  # 缩时影片合成（照片 -> 视频 + 日期字幕 + BGM）
  # 注：原 ffmpeg_kit_flutter 已停止维护，改用社区维护版 ffmpeg_kit_flutter_new（API 兼容，支持 AGP 9 内置 Kotlin）
  ffmpeg_kit_flutter_new: ^4.6.8

  # 视频预览播放
  video_player: ^2.8.6

  # 生物识别 / 应用锁
  local_auth: ^2.2.0

  # 本地通知（周期提醒 / 里程碑）
  flutter_local_notifications: ^17.2.1

  # 时间/日期格式化（0.20.3+ 为 flutter_localizations 所需）
  intl: ^0.20.3

  # UUID（项目 / 记录点唯一标识）
  uuid: ^4.4.0

  # 订阅 / 内购
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true

# sqlite3 native hook 默认从 GitHub 下载预编译库；本环境 GitHub 不可达，
# 改为读取工程内 sqlite3_libs/（已用镜像下载并校验 sha256，见 hook 内置哈希表）
hooks:
  user_defines:
    sqlite3:
      source: test-sqlite3
      directory: sqlite3_libs/
